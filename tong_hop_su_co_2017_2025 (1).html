           <td>4,59 tr. kWh</td>\n            <td>Rung động và ăn mòn điểm hàn nối đường ống nhỏ.</td>\n          </tr>\n          <tr>\n            <td>05/06/2021</td>\n            <td>Bục ống xả đọng hơi chính Lò 2B</td>\n            <td>16,45 giờ</td>\n            <td>8,88 tr. kWh</td>\n            <td>Xói mòn tại van và đường ống xả đọng.</td>\n          </tr>\n          <tr>\n            <td>09/06/2021</td>\n            <td>Bục ống sinh hơi tường sau</td>\n            <td>70,08 giờ</td>\n            <td>18,92 tr. kWh</td>\n            <td>Tập trung mài mòn tại tường sau buồng đốt.</td>\n          </tr>\n          <tr>\n            <td>18/06/2021</td>\n            <td>Bục ống sinh hơi nóc lò &amp; quá nhiệt 3 (1B)</td>\n            <td>226,88 giờ</td>\n            <td>61,25 tr. kWh</td>\n            <td>Bục ống sinh hơi nóc lò và thổi mòn chùm ống quá nhiệt cấp 3.</td>\n          </tr>\n          <tr>\n            <td>25/08/2021</td>\n            <td>Bục ống sinh hơi tường sau (Cos Kickout)</td>\n            <td>67,97 giờ</td>\n            <td>18,35 tr. kWh</td>\n            <td>Mài mòn tại góc chuyển dòng cút cong Kickout (Cos 8m).</td>\n          </tr>\n          <tr>\n            <td>20/09/2021</td>\n            <td>Bục ống sinh hơi</td>\n            <td>63,38 giờ</td>\n            <td>0,00 tr. kWh</td>\n            <td>Mòn rỗ vách ống sinh hơi.</td>\n          </tr>\n          <tr>\n            <td>22/10/2021</td>\n            <td>Bục ống sinh hơi do mài mòn</td>\n            <td>58,13 giờ</td>\n            <td>15,69 tr. kWh</td>\n            <td>Mài mòn thành ống dưới tác động dòng liệu.</td>\n          </tr>\n          <tr>\n            <td>23/10 &amp; 24/11</td>\n            <td>Xì tết chèn ty van MOV hơi chính (1A, 1B)</td>\n            <td>~11,6 giờ</td>\n            <td>6,26 tr. kWh</td>\n            <td>Lão hóa tết chèn van chịu áp lực và nhiệt độ cao.</td>\n          </tr>\n          <tr>\n            <td>08/11/2021</td>\n            <td>Bục ống sinh hơi ngoài buồng đốt</td>\n            <td>22,70 giờ</td>\n            <td>6,12 tr. kWh</td>\n            <td>Rò rỉ mối hàn ống ngoài buồng đốt.</td>\n          </tr>\n          <tr>\n            <td>23/11/2021</td>\n            <td>Bục ống sinh hơi</td>\n            <td>71,33 giờ</td>\n            <td>0,00 tr. kWh</td>\n            <td>Mòn cơ học vách ống.</td>\n          </tr>\n        </tbody>\n      </table></div>\n\n      <h3 class="sub-title">III. Giải pháp đột phá kỹ thuật từ năm 2021</h3>\n      <div class="callout callout-warning">\n        Trước tình trạng bục ống lò xảy ra liên tiếp do than pha trộn có hàm lượng xít đá tăng cao (17 - 27%), nhà máy đã đề xuất và triển khai giải pháp căn cơ: <strong>Thay thế toàn bộ các mảng ống sinh hơi từ vật liệu nguyên bản thép carbon SA-210C sang thép hợp kim chịu nhiệt và chống mài mòn cao cấp SA-213 T91</strong> tại các khu vực xung yếu (Cos Kickout 8m đến 18m tường sau).\n      </div>\n    </section>\n  '}], 2022: [{'id': 'sc-overview', 'title': 'TỔNG QUAN VẬN HÀNH\n        Tình hình sự cố và phân loại kỹ thuật năm 2022', 'html': '<section id="sc-overview" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-aux">TỔNG QUAN VẬN HÀNH</span>\n        Tình hình sự cố và phân loại kỹ thuật năm 2022\n      </div>\n      <p>Năm 2022 ghi nhận sự nỗ lực lớn trong việc kiểm soát mài mòn ống sinh hơi sau khi bước đầu áp dụng các giải pháp phun phủ và hàn đắp bảo vệ. Tuy nhiên, các sự cố về mạch đo lường C&amp;I, lỗi module điều khiển van tuabin và sự cố mất nguồn thanh cái trạm bơm nước tuần hoàn tiếp tục là những điểm nóng vận hành:</p>\n      \n<div class="table-container"><table class="data-table">\n        <thead>\n          <tr>\n            <th>Thời gian</th>\n            <th>Hệ thống / Thiết bị</th>\n            <th>Phân loại</th>\n            <th>Diễn biến &amp; Hậu quả chính</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td><strong>04/02/2022</strong></td>\n            <td>Tuabin Tổ máy S2</td>\n            <td>C&amp;I / Tuabin</td>\n            <td>Trip tuabin S2 do lỗi cảm biến điểm đo chân không hơi thoát bình ngưng nhánh A.</td>\n          </tr>\n          <tr>\n            <td><strong>19/03/2022</strong></td>\n            <td>Lò hơi buồng đốt</td>\n            <td>Áp lực Lò</td>\n            <td>Bục ống sinh hơi buồng đốt, dừng lò xử lý 71,68 giờ.</td>\n          </tr>\n          <tr>\n            <td><strong>16/04/2022</strong></td>\n            <td>Lò hơi buồng đốt</td>\n            <td>Áp lực Lò</td>\n            <td>Bục ống sinh hơi buồng đốt, dừng lò sửa chữa thay thế ống 98,67 giờ.</td>\n          </tr>\n          <tr>\n            <td><strong>01/05/2022</strong></td>\n            <td>Van điều khiển Tuabin S2</td>\n            <td>C&amp;I / Tuabin</td>\n            <td>Dừng Tuabin S2 để xử lý lỗi module servo PSVO điều khiển các van CV1-CV3, MSV2, IV1, IV2.</td>\n          </tr>\n          <tr>\n            <td><strong>13/10/2022</strong></td>\n            <td>Hệ thống điều khiển Lò 1A</td>\n            <td>C&amp;I / Lò hơi</td>\n            <td>MFT dừng khẩn cấp Lò hơi 1A do lỗi hệ thống điều khiển DCS / Controller.</td>\n          </tr>\n          <tr>\n            <td><strong>20/12/2022</strong></td>\n            <td>Thanh cái 10kV 06BBH</td>\n            <td>Hệ thống Điện</td>\n            <td>Mất nguồn thanh cái tuần hoàn 06BBH làm trip cả 2 bơm tuần hoàn, dẫn đến Trip Tổ máy S2.</td>\n          </tr>\n        </tbody>\n      </table></div>\n    </section>\n\n    '}, {'id': 'sc-0402', 'title': 'C&I / TUABIN\n        1. Sự cố Trip Tuabin S2 do lỗi điểm đo chân không bình ngưng nhánh A (04/02/2022)', 'html': '<section id="sc-0402" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-mech">C&amp;I / TUABIN</span>\n        1. Sự cố Trip Tuabin S2 do lỗi điểm đo chân không bình ngưng nhánh A (04/02/2022)\n      </div>\n      <h3 class="sub-title">I. Diễn biến sự cố</h3>\n      <ul>\n        <li>Lúc 10h30 ngày 04/02/2022: Nhận lệnh điều độ A0 ngừng dự phòng Lò hơi 2A. Tổ máy S2 đang vận hành 1 lò 2B.</li>\n        <li>Lúc 10h47 ngày 04/02/2022: Xuất hiện tín hiệu báo lỗi độ chân không bình ngưng nhánh A suy giảm nghiêm trọng. Hệ thống bảo vệ Mark VI kích hoạt lệnh <strong>Trip Tuabin S2</strong> ngay tức thì.</li>\n        <li>Kiểm tra thông số thực tế cho thấy chân không bình ngưng thực tế vẫn duy trì mức cao (-0.92 bar), tuabin hoàn toàn bình thường.</li>\n      </ul>\n      <h3 class="sub-title">II. Nguyên nhân &amp; Khắc phục</h3>\n      <div class="callout callout-warning">\n        <strong>Nguyên nhân:</strong> Do hỏng cảm biến áp suất đo chân không (Transmitter) nhánh A hoặc bị nghẽn đường ống xung dẫn tín hiệu chân không, làm giá trị áp suất đo được tăng cao vượt ngưỡng bảo vệ trip tuabin.\n      </div>\n      <p><strong>Khắc phục:</strong> Vệ sinh đường ống xung, thay thế transmitter đo chân không mới; kiểm tra cấu hình logic biểu quyết (voting logic) để đảm bảo không bị trip nhầm khi chỉ có 1 kênh đo đơn lẻ bị lỗi.</p>\n    </section>\n\n    '}, {'id': 'sc-1903', 'title': 'ÁP LỰC LÒ HƠI\n        2. Các sự cố bục ống sinh hơi buồng đốt lò hơi (19/03/2022 & 16/04/2022)', 'html': '<section id="sc-1903" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">ÁP LỰC LÒ HƠI</span>\n        2. Các sự cố bục ống sinh hơi buồng đốt lò hơi (19/03/2022 &amp; 16/04/2022)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng &amp; Hậu quả</h3>\n      <p>Trong tháng 3 và tháng 4/2022, lò hơi tiếp tục chịu ảnh hưởng của hiện tượng xói mòn cơ học do than xấu pha trộn:</p>\n      <ul>\n        <li><strong>Sự cố ngày 19/03/2022:</strong> Lưu lượng nước cấp tăng bất thường, buồng đốt dao động áp suất, phát hiện bục ống sinh hơi. Thời gian dừng lò khắc phục là <strong>71,68 giờ</strong>.</li>\n        <li><strong>Sự cố ngày 16/04/2022:</strong> Bục ống sinh hơi vách buồng đốt, vết rách phát triển lớn làm giảm nhanh mức nước bao hơi. Thời gian dừng sửa chữa, thay thế đoạn ống bị hỏng kéo dài <strong>98,67 giờ</strong>.</li>\n      </ul>\n      <h3 class="sub-title">II. Biện pháp kỹ thuật</h3>\n      <p>Tăng cường mật độ đo chiều dày siêu âm tại các kỳ dừng máy, mở rộng phạm vi phun phủ hợp kim chịu mài mòn và hàn ốp lá mía tại các góc chuyển dòng khói xỉ.</p>\n    </section>\n\n    '}, {'id': 'sc-0105', 'title': 'C&I / TUABIN\n        3. Dừng Tuabin S2 do lỗi module servo PSVO điều khiển hệ thống van hơi (01/05/2022)', 'html': '<section id="sc-0105" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-mech">C&amp;I / TUABIN</span>\n        3. Dừng Tuabin S2 do lỗi module servo PSVO điều khiển hệ thống van hơi (01/05/2022)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng và Nguy cơ</h3>\n      <p>Lúc 12h36 ngày 01/05/2022, tổ máy S2 đang mang tải thì xuất hiện dao động vị trí và mất đồng bộ phản hồi độ mở tại các van điều chỉnh hơi chính CV1, CV2, CV3, van chặn chính MSV2 và các van đánh chặn IV1, IV2. Đèn cảnh báo Fault sáng trên các module điều khiển servo PSVO (4A1A, 4A2A, 4A3A) trong tủ điều khiển Mark VI.</p>\n\n      <h3 class="sub-title">II. Xử lý sự cố</h3>\n      <div class="callout callout-warning">\n        <strong>Xử lý:</strong> Việc dao động các van hơi chính đe dọa trực tiếp đến sự ổn định vòng quay và tải của tuabin máy phát. Trưởng ca đã xin lệnh A0 chủ động tách tải và dừng Tuabin S2 an toàn để đội C&amp;I phối hợp chuyên gia kiểm tra, vệ sinh jack cắm, căn chỉnh dòng servo và thay thế các board card module PSVO bị lỗi.\n      </div>\n    </section>\n\n    '}, {'id': 'sc-1310', 'title': 'C&I / LÒ HƠI\n        4. Sự cố dừng Lò hơi 1A do lỗi hệ thống điều khiển DCS (13/10/2022)', 'html': '<section id="sc-1310" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">C&amp;I / LÒ HƠI</span>\n        4. Sự cố dừng Lò hơi 1A do lỗi hệ thống điều khiển DCS (13/10/2022)\n      </div>\n      <h3 class="sub-title">I. Diễn biến sự cố</h3>\n      <p>Lúc 01h21 ngày 13/10/2022, Lò hơi 1A đang vận hành bình thường thì bất ngờ xuất hiện lỗi phần cứng trên bộ xử lý Controller / mạch truyền thông điều khiển lò hơi. Tín hiệu đầu vào/đầu ra (I/O) bị gián đoạn, mất phản hồi điều khiển vòng kín các van cấp than và khói gió. Hệ thống tự động phát lệnh <strong>MFT dừng khẩn cấp Lò hơi 1A</strong> để đảm bảo an toàn buồng đốt.</p>\n      <p><strong>Khắc phục:</strong> Kíp trực và tổ tự động C&amp;I đã tiến hành reset card nguồn, kiểm tra cáp quang truyền thông, thay thế module CPU bị lỗi và khởi động lại lò sau khi khôi phục kết nối điều khiển an toàn.</p>\n    </section>\n\n    '}, {'id': 'sc-2012', 'title': 'HỆ THỐNG ĐIỆN\n        5. Mất nguồn thanh cái 10kV 06BBH trạm tuần hoàn gây dừng 2 bơm tuần hoàn và Trip Tổ máy S2 (20/12/2022)', 'html': '<section id="sc-2012" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-elec">HỆ THỐNG ĐIỆN</span>\n        5. Mất nguồn thanh cái 10kV 06BBH trạm tuần hoàn gây dừng 2 bơm tuần hoàn và Trip Tổ máy S2 (20/12/2022)\n      </div>\n      <h3 class="sub-title">I. Diễn biến chuỗi sự cố</h3>\n      <ul>\n        <li>Lúc 07h08 ngày 20/12/2022, tổ máy S2 đang phát công suất lên lưới thì xảy ra sự cố mất điện hoàn toàn thanh cái 10kV trạm bơm tuần hoàn <strong>06BBH</strong>.</li>\n        <li>Hậu quả làm cắt điện và dừng sự cố cả 2 bơm nước tuần hoàn (CWP) đang làm việc cung cấp nước làm mát cho bình ngưng Tổ máy S2.</li>\n        <li>Mất nguồn nước làm mát bình ngưng làm chân không hơi thoát tuabin tụt dốc cực nhanh, kích hoạt bảo vệ chân không thấp làm <strong>Trip Tổ máy S2</strong>.</li>\n      </ul>\n      <h3 class="sub-title">II. Bài học kinh nghiệm</h3>\n      <div class="callout callout-danger">\n        <strong>Bài học chuyển nguồn trạm tuần hoàn:</strong> Thanh cái 10kV trạm tuần hoàn là nguồn điện sống còn duy trì chân không tổ máy. Cần thường xuyên kiểm tra cơ cấu liên động tự động chuyển nguồn (ATS) giữa các nhánh 06BBG và 06BBH, bảo đảm khi một nhánh phân đoạn gặp sự cố máy cắt thì phân đoạn còn lại phải tự động khép liên lạc cấp điện cho ít nhất 01 bơm tuần hoàn hoạt động.\n      </div>\n    </section>\n  '}], 2023: [{'id': 'sc-overview', 'title': 'TỔNG QUAN KỸ THUẬT\n        Tình hình sự cố và bước ngoặt kỹ thuật năm 2023', 'html': '<section id="sc-overview" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-aux">TỔNG QUAN KỸ THUẬT</span>\n        Tình hình sự cố và bước ngoặt kỹ thuật năm 2023\n      </div>\n      <p>Năm 2023 tiếp tục là năm chịu thách thức lớn về sự cố đường ống áp lực lò hơi tầng sôi tuần hoàn (CFB), đồng thời ghi nhận các sự cố phức tạp về hệ thống điều khiển khớp nối thủy lực, kẹt trục tuabin và chạm chập thanh cái tự dùng do động vật xâm nhập:</p>\n      \n<div class="table-container"><table class="data-table">\n        <thead>\n          <tr>\n            <th>Hệ thống</th>\n            <th>Đặc điểm nổi bật năm 2023</th>\n            <th>Các sự cố tiêu biểu</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td><strong>Ống áp lực Lò hơi</strong></td>\n            <td>Chiếm đa số các vụ dừng lò; nứt vỡ tại các điểm hàn đắp tạm thời và mài mòn cục bộ do xít than.</td>\n            <td>Chuỗi bục ống sinh hơi (tháng 3, 4, 5, 6, 7, 10, 12); bục ống bộ hâm (19/09); xì hở đường rót than (13/06).</td>\n          </tr>\n          <tr>\n            <td><strong>Cơ khí &amp; Tuabin</strong></td>\n            <td>Sự cố liên động van và bó kẹt cơ khí trong quá trình khởi động / dừng máy.</td>\n            <td>Lỗi điều khiển van bảo vệ trip Tuabin (26/04); sự cố kẹt trục Tuabin S2 (14/07).</td>\n          </tr>\n          <tr>\n            <td><strong>Điện &amp; C&amp;I</strong></td>\n            <td>Mất nguồn điều khiển khớp nối thủy lực; sự cố ngoại vật xâm nhập ngăn máy cắt.</td>\n            <td>Lỗi nguồn khớp nối thủy lực bơm cấp gây MFT Lò 1B (03/07); Chuột xâm nhập ngăn TU9TD92B gây trip MBA TD92 (31/12).</td>\n          </tr>\n          <tr>\n            <td><strong>Đột phá kỹ thuật</strong></td>\n            <td>Tổng công ty GENCO 3 phê duyệt phương án thay thế mảng ống SA213-T91 trong đợt tiểu tu S1 (tháng 8/2023).</td>\n            <td>Thay toàn bộ mảng ống tường sau Lò 1B từ Cos Kickout 8m đến Cos 18m bằng vật liệu thép hợp kim cao cấp T91.</td>\n          </tr>\n        </tbody>\n      </table></div>\n    </section>\n\n    '}, {'id': 'sc-1806', 'title': 'SỰ CỐ TRỌNG TÂM\n        1. Sự cố bục ống sinh hơi Lò 1B và MFT Lò 1A do xì hở ống khí nén cánh hướng (18/06/2023)', 'html': '<section id="sc-1806" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">SỰ CỐ TRỌNG TÂM</span>\n        1. Sự cố bục ống sinh hơi Lò 1B và MFT Lò 1A do xì hở ống khí nén cánh hướng (18/06/2023)\n      </div>\n      <h3 class="sub-title">I. Diễn biến sự cố liên hoàn</h3>\n      <ul>\n        <li><strong>15h59:</strong> Tổ máy S1 đang phát 540 MW. Áp lực buồng đốt Lò 1B tăng đột ngột từ -1 mbar lên +6 mbar, dòng quạt khói A/B tăng vọt lên 107A/113A, chênh lệch nước/hơi tăng cao. Vận hành xác nhận Lò 1B bục ống sinh hơi, tiến hành giảm tải và tách hơi lúc 16h12.</li>\n        <li><strong>16h14:</strong> Ấn MFT dừng Lò 1B do tốc độ giảm nhiệt độ đạt -8°C/phút. Tổ máy S1 giảm công suất còn 270 MW với 1 Lò 1A duy trì vận hành.</li>\n        <li><strong>16h16p20:</strong> Đang trong quá trình cô lập Lò 1B, Lò trưởng 1A phát hiện lưu lượng gió sơ cấp Lò 1A tụt đột ngột từ 460 t/h về 165 t/h; 02 van cánh hướng đầu hút quạt gió sơ cấp A/B tự động đóng sập về 5%. Áp lực buồng đốt Lò 1A tụt sâu từ -0,8 mbar xuống -30 mbar.</li>\n        <li><strong>16h16p31:</strong> Tín hiệu bảo vệ áp lực buồng đốt cực thấp (&lt; -25 mbar trong 3s) tác động kích hoạt lệnh <strong>MFT Lò hơi 1A</strong>, dẫn tới ngừng toàn bộ Tổ máy S1.</li>\n      </ul>\n\n      <h3 class="sub-title">II. Nguyên nhân kỹ thuật</h3>\n      <div class="callout callout-danger">\n        <strong>Nguyên nhân Lò 1B:</strong> Ống số 245 (vật liệu SA-210C) bị nứt tại mối hàn đắp xử lý tạm trước đó (tháng 5/2023); luồng nước áp lực cao phun ra từ vết nứt đã xói mòn và thổi bục tiếp 2 ống bên cạnh là 244 và 246 tại Cos Kickout tường sau.<br><br>\n        <strong>Nguyên nhân Lò 1A:</strong> Bị xì hở đầu nối ống mềm cấp khí nén điều khiển bộ dẫn động (actuator) van cánh hướng đầu hút quạt gió sơ cấp A/B. Mất áp lực khí nén làm xi lanh chấp hành không giữ được lực và kéo đóng sập van cánh hướng, triệt tiêu dòng gió sơ cấp gây sụt áp lực buồng lửa.\n      </div>\n    </section>\n\n    '}, {'id': 'sc-0307', 'title': 'C&I / LÒ HƠI\n        2. MFT Lò 1B do lỗi nguồn bộ chuyển đổi khớp nối thủy lực bơm cấp (03/07/2023)', 'html': '<section id="sc-0307" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-elec">C&amp;I / LÒ HƠI</span>\n        2. MFT Lò 1B do lỗi nguồn bộ chuyển đổi khớp nối thủy lực bơm cấp (03/07/2023)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng &amp; Cơ chế tác động</h3>\n      <p>Lúc 01h25 ngày 03/07/2023, tổ máy đang mang tải thì bộ nguồn chuyển đổi cấp tín hiệu điều khiển khớp nối thủy lực bơm nước cấp Lò 1B bị mất điện đột ngột. Cơ cấu điều khiển tốc độ khớp nối bị tê liệt, lưu lượng nước cấp lên bao hơi Lò 1B suy giảm nghiêm trọng. Hệ thống bảo vệ liên động kích hoạt <strong>MFT dừng khẩn cấp Lò 1B</strong>.</p>\n      <p><strong>Khắc phục:</strong> Kíp trực và đội tự động đã khẩn trương thay thế bộ chuyển đổi nguồn, đo đạc ổn định tín hiệu điều khiển và khôi phục lại Lò 1B hòa mạng sau 0,6 giờ.</p>\n    </section>\n\n    '}, {'id': 'sc-1407', 'title': 'PHẦN TUABIN\n        3. Sự cố kẹt trục Tuabin Tổ máy S2 (14/07/2023)', 'html': '<section id="sc-1407" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-mech">PHẦN TUABIN</span>\n        3. Sự cố kẹt trục Tuabin Tổ máy S2 (14/07/2023)\n      </div>\n      <h3 class="sub-title">I. Diễn biến và phân tích</h3>\n      <p>Ngày 14/07/2023, trong quá trình vận hành / dừng quay trục, Tuabin tổ máy S2 xuất hiện hiện tượng tăng mô-men cản quay trục, thiết bị vần trục (Turning Gear) bị quá dòng ngắt bảo vệ, trục tuabin có dấu hiệu kẹt cơ khí cục bộ tại các vành chèn hơi hoặc gối trục.</p>\n      <p><strong>Xử lý:</strong> Thực hiện quy trình ủ nhiệt tuabin nghiêm ngặt, theo dõi độ đảo trục và chênh lệch nhiệt độ thân trên/dưới xilanh; kiểm tra độ sạch và áp lực dầu nâng trục (Jacking Oil); kiên trì quay nhích trục thủ công kết hợp theo dõi giãn nở nhiệt trước khi đưa thiết bị vần trục điện trở lại làm việc an toàn.</p>\n    </section>\n\n    '}, {'id': 'sc-1908', 'title': 'HỆ THỐNG ĐIỆN\n        4. Sự cố Máy biến áp tự dùng TD11 & Sét đánh đường dây 171 (19/08/2023)', 'html': '<section id="sc-1908" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-elec">HỆ THỐNG ĐIỆN</span>\n        4. Sự cố Máy biến áp tự dùng TD11 &amp; Sét đánh đường dây 171 (19/08/2023)\n      </div>\n      <h3 class="sub-title">I. Diễn biến</h3>\n      <ul>\n        <li>Lúc 05h48 ngày 19/08/2023: Giông sét lớn đánh trực tiếp vào tuyến đường dây 110kV 171 liên kết cấp nguồn dự phòng, bảo vệ đường dây tác động cắt máy cắt cách ly sự cố.</li>\n        <li>Cùng ngày, hệ thống rơ le bảo vệ khối máy biến áp tự dùng <strong>TD11</strong> (cấp nguồn tự dùng 10kV) tác động, đe dọa gián đoạn nguồn cấp tự dùng khối 2. Vận hành đã nhanh chóng chuyển đổi phương thức kết dây nhận nguồn liên lạc để giữ các tổ máy vận hành an toàn.</li>\n      </ul>\n    </section>\n\n    '}, {'id': 'sc-0311', 'title': 'PHẦN LÒ HƠI\n        5. Dừng Lò hơi 2A do bục khớp giãn nở đường cấp gió sơ cấp (03/11/2023)', 'html': '<section id="sc-0311" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">PHẦN LÒ HƠI</span>\n        5. Dừng Lò hơi 2A do bục khớp giãn nở đường cấp gió sơ cấp (03/11/2023)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng &amp; Hậu quả</h3>\n      <p>Lúc 21h35 ngày 03/11/2023, nhân viên vận hành phát hiện bục rách khớp giãn nở đường gió sơ cấp PA Lò 2A. Bụi than và gió nóng áp lực cao phì mạnh ra khu vực sàn thao tác, áp lực buồng đốt dao động không thể duy trì tầng sôi ổn định. Trưởng ca đã ra lệnh chủ động tách và dừng Lò 2A; thời gian ngừng lò sửa chữa kéo dài <strong>92,45 giờ</strong>.</p>\n    </section>\n\n    '}, {'id': 'sc-3112', 'title': 'PHẦN ĐIỆN\n        6. Chuột chui ngăn TU9TD92B gây chạm chập, Trip MBA TD92 và mất nguồn thanh cái 92B (31/12/2023)', 'html': '<section id="sc-3112" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-elec">PHẦN ĐIỆN</span>\n        6. Chuột chui ngăn TU9TD92B gây chạm chập, Trip MBA TD92 và mất nguồn thanh cái 92B (31/12/2023)\n      </div>\n      <h3 class="sub-title">I. Diễn biến sự cố hi hữu</h3>\n      <p>Vào lúc 19h36 ngày 31/12/2023 (đêm giao thừa Tết Dương lịch), xuất hiện sự cố phóng điện chạm chập ngắn mạch pha-đất dữ dội tại ngăn máy cắt <strong>942B</strong> (ngăn máy cắt lộ tổng hạ áp MBA TD92 cấp cho thanh cái 10kV 26BBB / 92B):</p>\n      <ul>\n        <li>Bảo vệ rơ le tác động cắt MC 942B và gửi lệnh Trip máy biến áp tự dùng khối 2 (TD92).</li>\n        <li>Gây mất điện đột ngột toàn bộ phân đoạn thanh cái 10kV 92B cùng các phụ tải tự dùng quan trọng của khối 2; thời gian gián đoạn xử lý kéo dài 5,42 giờ (sản lượng điện thiếu hụt 2,925 tr. kWh).</li>\n      </ul>\n      <h3 class="sub-title">II. Nguyên nhân &amp; Biện pháp phòng ngừa</h3>\n      <div class="callout callout-warning">\n        <strong>Nguyên nhân:</strong> Do chuột chui lọt qua khe hở cáp nhị thứ vào bên trong ngăn biến điện áp đo lường TU9TD92B tại tủ MC 942B gây phóng điện chạm chập ngắn mạch 2 pha.<br>\n        <strong>Khắc phục:</strong> Vệ sinh cách điện ngăn TU, thay thế biến điện áp bị cháy; tổng kiểm tra bịt kín toàn bộ các lỗ luồn cáp tại tất cả các tủ điện 10kV và 0.4kV bằng keo chống cháy và lưới thép chống chuột.\n      </div>\n    </section>\n\n    '}, {'id': 'sc-buc-ong', 'title': 'ÁP LỰC LÒ HƠI\n        7. Thống kê chuỗi sự cố bục ống áp lực lò hơi năm 2023', 'html': '<section id="sc-buc-ong" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">ÁP LỰC LÒ HƠI</span>\n        7. Thống kê chuỗi sự cố bục ống áp lực lò hơi năm 2023\n      </div>\n<div class="table-container"><table class="data-table">\n        <thead>\n          <tr>\n            <th>Thời gian</th>\n            <th>Vị trí bục / Thiết bị</th>\n            <th>Cấp sự cố</th>\n            <th>Thời gian dừng</th>\n            <th>Đặc điểm nguyên nhân</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td>08/04/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 3</td>\n            <td>71,62 giờ</td>\n            <td>Mài mòn cơ học vách ống sinh hơi.</td>\n          </tr>\n          <tr>\n            <td>01/05/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 3</td>\n            <td>71,23 giờ</td>\n            <td>Xói mòn thành ống dưới tác động tro xỉ CFB.</td>\n          </tr>\n          <tr>\n            <td>07/05/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 3</td>\n            <td>45,02 giờ</td>\n            <td>Bục ống sinh hơi góc buồng đốt.</td>\n          </tr>\n          <tr>\n            <td>09/06/2023</td>\n            <td>Ống sinh hơi tường sau</td>\n            <td>Cấp 3</td>\n            <td>56,60 giờ</td>\n            <td>Mòn cơ học vách ống tiếp giáp lớp bảo ôn.</td>\n          </tr>\n          <tr>\n            <td>13/06/2023</td>\n            <td>Đường ống rót than buồng đốt</td>\n            <td>Cấp 3</td>\n            <td>11,28 giờ</td>\n            <td>Xì hở mài mòn cổ rót than vào buồng đốt.</td>\n          </tr>\n          <tr>\n            <td>18/06/2023</td>\n            <td>Ống sinh hơi 244-246 tường sau 1B</td>\n            <td>Cấp 3</td>\n            <td>93,73 giờ</td>\n            <td>Nứt mối hàn đắp ống 245 thổi bục ống 244, 246.</td>\n          </tr>\n          <tr>\n            <td>26/06/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 3</td>\n            <td>83,27 giờ</td>\n            <td>Mài mòn giảm mỏng chiều dày vách ống.</td>\n          </tr>\n          <tr>\n            <td>01/07/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 3</td>\n            <td>100,10 giờ</td>\n            <td>Bục vỡ ống sinh hơi áp lực cao.</td>\n          </tr>\n          <tr>\n            <td>06/07/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 3</td>\n            <td>78,55 giờ</td>\n            <td>Xói mòn dòng liệu tầng sôi.</td>\n          </tr>\n          <tr>\n            <td>09/07/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 2</td>\n            <td>227,92 giờ</td>\n            <td>Sự cố bục ống sinh hơi diện rộng kéo dài gần 10 ngày.</td>\n          </tr>\n          <tr>\n            <td>20/07/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 2</td>\n            <td>176,12 giờ</td>\n            <td>Bục ống sinh hơi mức độ nghiêm trọng.</td>\n          </tr>\n          <tr>\n            <td>19/09/2023</td>\n            <td>Ống bộ hâm nước (Economizer)</td>\n            <td>Cấp 3</td>\n            <td>70,98 giờ</td>\n            <td>Xói mòn tro bay chùm ống bộ hâm đuôi lò.</td>\n          </tr>\n          <tr>\n            <td>22/10/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 3</td>\n            <td>109,20 giờ</td>\n            <td>Bục ống sinh hơi sau đợt tiểu tu S1.</td>\n          </tr>\n          <tr>\n            <td>10/12/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 3</td>\n            <td>92,98 giờ</td>\n            <td>Mài mòn cơ học vách ống.</td>\n          </tr>\n          <tr>\n            <td>30/12/2023</td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Cấp 3</td>\n            <td>17,75 giờ</td>\n            <td>Xì hở vi nứt mối hàn ống sinh hơi.</td>\n          </tr>\n        </tbody>\n      </table></div>\n    </section>\n  '}], 2024: [{'id': 'sc-overview', 'title': 'TỔNG QUAN KỸ THUẬT\n        Tình hình vận hành và phân loại sự cố năm 2024', 'html': '<section id="sc-overview" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-aux">TỔNG QUAN KỸ THUẬT</span>\n        Tình hình vận hành và phân loại sự cố năm 2024\n      </div>\n      <p>Năm 2024 ghi nhận các diễn biến kỹ thuật mang tính thử thách cao đối với lực lượng vận hành, từ sự cố liên hoàn mạch bảo vệ tự dùng, bão lịch sử Yagi làm tan rã lưới điện đến các sự cố chạm đất DC điều khiển kích hoạt trip đồng thời cả 2 tổ máy:</p>\n      \n<div class="table-container"><table class="data-table">\n        <thead>\n          <tr>\n            <th>Nhóm sự cố</th>\n            <th>Đặc điểm nổi bật</th>\n            <th>Vụ việc tiêu biểu</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td><strong>Sự cố Phần Điện &amp; Nhị thứ</strong></td>\n            <td>Các sự cố chạm đất DC kích hoạt bảo vệ 86G; sự cố rơ le nhảy máy cắt sân phân phối 500kV; sự cố chạm đất thanh cái tự dùng.</td>\n            <td>Chạm đất DC kép làm trip cả 2 tổ máy S1 &amp; S2 (23/10); Nhảy MC 531 SPP 500kV làm trip S2 (12/09); Chạm đất TC đá vôi làm sụt áp TC 04BBD (19/05).</td>\n          </tr>\n          <tr>\n            <td><strong>Sự cố Điều khiển &amp; C&amp;I</strong></td>\n            <td>Lỗi phần cứng CPU điều khiển lò hơi và cảm biến nhiệt độ ổ đỡ quạt/bộ sấy không khí.</td>\n            <td>Lỗi watchdog timer trên CPU lò 1A (05/01); Lỗi điểm đo nhiệt độ gối BSKK kích hoạt MFT Lò 1B (19/02).</td>\n          </tr>\n          <tr>\n            <td><strong>Ống áp lực Lò hơi</strong></td>\n            <td>Các vụ bục ống sinh hơi, ống quá nhiệt cấp 3 tiếp tục diễn ra tại các vùng xói mòn tro xỉ tầng sôi.</td>\n            <td>Bục ống sinh hơi (tháng 1, 2, 4, 5, 6, 9, 10, 11); Bục ống quá nhiệt cấp 3 (28/05).</td>\n          </tr>\n          <tr>\n            <td><strong>Sự kiện Thiên tai Bất khả kháng</strong></td>\n            <td>Cơn bão số 3 (Yagi) đổ bộ trực tiếp vào Quảng Ninh làm sụp đổ các tuyến đường dây truyền tải, gây mất điện toàn trạm.</td>\n            <td>Sự cố rã lưới và mất điện toàn nhà máy ngày 07/09/2024; kíp trực giữ an toàn thiết bị thành công.</td>\n          </tr>\n        </tbody>\n      </table></div>\n    </section>\n\n    '}, {'id': 'sc-0501', 'title': 'C&I / LÒ HƠI\n        1. Sự cố MFT Lò hơi 1A do lỗi mạch Watchdog Timer trên CPU điều khiển (05/01/2024)', 'html': '<section id="sc-0501" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">C&amp;I / LÒ HƠI</span>\n        1. Sự cố MFT Lò hơi 1A do lỗi mạch Watchdog Timer trên CPU điều khiển (05/01/2024)\n      </div>\n      <h3 class="sub-title">I. Diễn biến và nguyên nhân</h3>\n      <p>Lúc 12h08 ngày 05/01/2024, Lò hơi 1A đang vận hành bình thường thì bộ vi xử lý trung tâm (CPU) điều khiển Lò 1A bị treo cứng bộ đếm thời gian giám sát phần cứng (Watchdog Timer). Việc ngắt mạch giám sát CPU khiến hệ thống an toàn tự động phát lệnh <strong>MFT dừng khẩn cấp Lò 1A</strong> để chống mất kiểm soát các van cấp than và khói gió.</p>\n      <p><strong>Xử lý:</strong> Kíp trực và đội tự động C&amp;I đã thay thế module CPU dự phòng, nạp lại chương trình cấu hình điều khiển và khôi phục Lò 1A vận hành an toàn sau 0,72 giờ.</p>\n    </section>\n\n    '}, {'id': 'sc-1902', 'title': 'TRỌNG TÂM LÒ - MÁY\n        2. Sự cố MFT liên hoàn Lò 1B, Lò 1A và Trip Tổ máy S1 (19/02/2024)', 'html': '<section id="sc-1902" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">TRỌNG TÂM LÒ - MÁY</span>\n        2. Sự cố MFT liên hoàn Lò 1B, Lò 1A và Trip Tổ máy S1 (19/02/2024)\n      </div>\n      <h3 class="sub-title">I. Diễn biến sự cố liên hoàn</h3>\n      <ul>\n        <li><strong>21h12:</strong> Lò hơi 1B xuất hiện tín hiệu báo lỗi nhiệt độ gối trục trên bộ sấy không khí tăng cao vượt ngưỡng bảo vệ, kích hoạt lệnh <strong>MFT dừng khẩn cấp Lò hơi 1B</strong>.</li>\n        <li>Sau khi Lò 1B dừng đột ngột, phụ tải hơi bị dồn ép sang Lò 1A. Áp lực bao hơi biến động mạnh, mức nước bao hơi Lò 1A dâng cao mất kiểm soát.</li>\n        <li><strong>21h15 (sau 3 phút):</strong> Mức nước bao hơi Lò 1A vượt ngưỡng +254 mm, bảo vệ mức nước cao-cao tác động gây <strong>MFT Lò hơi 1A</strong>.</li>\n        <li>Mất hoàn toàn cả 2 nguồn sinh hơi, hệ thống bảo vệ tuabin kích hoạt <strong>Trip Tuabin và Tổ máy S1</strong>.</li>\n      </ul>\n      <h3 class="sub-title">II. Bài học điều khiển giữ lò còn lại</h3>\n      <div class="callout callout-danger">\n        <strong>Bài học thao tác Lò trưởng:</strong> Khi một lò bị MFT đột ngột, Lò trưởng của lò còn lại phải lập tức chuyển Manual van đài nước cấp và Boiler Master để hãm lưu lượng hơi, điều chỉnh áp lực van Bypass cao áp kịp thời để duy trì chênh áp nước cấp, khống chế mức nước bao hơi không để nhảy bảo vệ MFT lò thứ hai.\n      </div>\n    </section>\n\n    '}, {'id': 'sc-2004', 'title': 'PHẦN LÒ HƠI\n        3. Sự cố MFT Lò hơi 2B do mức nước bao hơi thấp (20/04/2024)', 'html': '<section id="sc-2004" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">PHẦN LÒ HƠI</span>\n        3. Sự cố MFT Lò hơi 2B do mức nước bao hơi thấp (20/04/2024)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng &amp; Xử lý</h3>\n      <p>Lúc 08h29 ngày 20/04/2024, trong quá trình vận hành điều chỉnh chế độ nước cấp Lò 2B, xuất hiện dao động chênh áp giữa ống góp nước cấp và bao hơi. Mức nước bao hơi Lò 2B tụt nhanh xuống dưới ngưỡng bảo vệ thấp-thấp (&lt; -254 mm), kích hoạt lệnh MFT dừng khẩn cấp Lò 2B (sản lượng điện thiếu hụt 0,702 tr. kWh; khôi phục sau 1,3 giờ).</p>\n    </section>\n\n    '}, {'id': 'sc-1905', 'title': 'HỆ THỐNG ĐIỆN\n        4. Chạm đất thanh cái đá vôi gây sụt áp thanh cái tự dùng 04BBD, Trip Tổ máy S1 (19/05/2024)', 'html': '<section id="sc-1905" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-elec">HỆ THỐNG ĐIỆN</span>\n        4. Chạm đất thanh cái đá vôi gây sụt áp thanh cái tự dùng 04BBD, Trip Tổ máy S1 (19/05/2024)\n      </div>\n      <h3 class="sub-title">I. Diễn biến và cơ chế tác động</h3>\n      <p>Lúc 04h15 ngày 19/05/2024, xảy ra chạm đất ngắn mạch tại phân đoạn thanh cái trạm chuẩn bị đá vôi. Dòng ngắn mạch làm sụt áp sâu trên hệ thống thanh cái hạ thế tự dùng <strong>04BBD</strong> của Tổ máy S1:</p>\n      <ul>\n        <li>Hiện tượng sụt áp làm hàng loạt tiếp điểm điều khiển van đầu đẩy các bơm nước cấp báo lỗi chập chờn.</li>\n        <li>Hệ thống liên động bảo vệ DCS nhận định sai trạng thái nguồn nước cấp, kích hoạt bảo vệ liên động dừng lò hơi và Trip Tuabin Tổ máy S1 (thời gian xử lý 1,78 giờ).</li>\n      </ul>\n    </section>\n\n    '}, {'id': 'sc-0709', 'title': 'SỰ KIỆN ĐẶC BIỆT\n        5. Sự cố mất điện toàn nhà máy (Blackout) do ảnh hưởng bão số 3 Yagi (07/09/2024)', 'html': '<section id="sc-0709" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-aux">SỰ KIỆN ĐẶC BIỆT</span>\n        5. Sự cố mất điện toàn nhà máy (Blackout) do ảnh hưởng bão số 3 Yagi (07/09/2024)\n      </div>\n      <h3 class="sub-title">I. Diễn biến thiên tai</h3>\n      <p>Ngày 07/09/2024, siêu bão Yagi đổ bộ trực tiếp vào tâm bão Quảng Ninh với sức gió cấp 14 - 17 kèm mưa lớn cực đoan. Gió giật làm đổ gãy hàng loạt cột truyền tải và đứt đường dây điện 500kV, 110kV liên kết với nhà máy, gây cô lập hoàn toàn nhà máy khỏi lưới điện quốc gia.</p>\n\n      <h3 class="sub-title">II. Ứng phó khẩn cấp của kíp trực</h3>\n      <div class="callout callout-warning">\n        <strong>Xử lý Blackout:</strong> Toàn bộ 2 tổ máy tự động trip an toàn. Các máy phát Diesel khẩn cấp (EDG) tự động khởi động hòa mạng cấp điện cho các phụ tải sống còn (bơm dầu bôi trơn sự cố DC, bơm ngưng khẩn cấp, thiết bị vần trục tuabin và hệ thống DCS). Kíp trực đã túc trực 100% quân số, bảo vệ tuyệt đối an toàn rôto tuabin, ngăn ngừa cong võng trục và sẵn sàng khôi phục ngay khi có điện lưới.\n      </div>\n    </section>\n\n    '}, {'id': 'sc-1209', 'title': 'PHẦN ĐIỆN\n        6. Nhảy Máy cắt 531 SPP 500kV làm Trip MBA T1, TD91 và Trip Tổ máy S2 (12/09/2024)', 'html': '<section id="sc-1209" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-elec">PHẦN ĐIỆN</span>\n        6. Nhảy Máy cắt 531 SPP 500kV làm Trip MBA T1, TD91 và Trip Tổ máy S2 (12/09/2024)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng và Hậu quả</h3>\n      <p>Lúc 16h06 ngày 12/09/2024 (trong giai đoạn khắc phục sau bão Yagi), máy cắt 531 tại sân phân phối 500kV bất ngờ nhảy mở, kéo theo trip máy biến áp chính T1 và máy biến áp tự dùng TD91. Dao động điện áp và mất nguồn liên thông khiến hệ thống bảo vệ kích hoạt <strong>Trip Tổ máy S2</strong> (thời gian gián đoạn 0,33 giờ).</p>\n    </section>\n\n    '}, {'id': 'sc-0710', 'title': 'THIẾT BỊ PHỤ\n        7. Dừng lò do độ rung bộ sấy không khí (BSKK) tăng cao bất thường (07/10/2024)', 'html': '<section id="sc-0710" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">THIẾT BỊ PHỤ</span>\n        7. Dừng lò do độ rung bộ sấy không khí (BSKK) tăng cao bất thường (07/10/2024)\n      </div>\n      <h3 class="sub-title">I. Diễn biến</h3>\n      <p>Lúc 22h03 ngày 07/10/2024, bộ sấy không khí xuất hiện dao động rung cơ khí tăng đột biến vượt ngưỡng bảo vệ nguy hiểm (&gt; 285 µm). Để chống gãy trục và phá hủy ổ đỡ gối BSKK, vận hành đã xin lệnh dừng lò để cân bằng động và vệ sinh loại bỏ mảng bám tro xỉ (thời gian dừng xử lý kéo dài <strong>69,48 giờ</strong>).</p>\n    </section>\n\n    '}, {'id': 'sc-2310', 'title': 'PHẦN ĐIỆN\n        8. Chạm đất hệ thống DC một chiều kích hoạt bảo vệ 86G, Trip cả 2 Tổ máy S1 & S2 (23/10/2024)', 'html': '<section id="sc-2310" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-elec">PHẦN ĐIỆN</span>\n        8. Chạm đất hệ thống DC một chiều kích hoạt bảo vệ 86G, Trip cả 2 Tổ máy S1 &amp; S2 (23/10/2024)\n      </div>\n      <h3 class="sub-title">I. Hai lần tác động trong cùng một ngày</h3>\n      <ul>\n        <li><strong>Lần 1 (05h27 ngày 23/10/2024):</strong> Xảy ra chạm đất hệ thống điện một chiều DC tại các thanh cái của 2 tổ máy. Lỗi chạm đất gây nhiễu xung tín hiệu điện áp điều khiển truyền vào rơ le bảo vệ máy phát, kích hoạt chức năng <em>TR FAULT</em> gửi lệnh khởi động rơ le Lockout 86GA, 86GB; cắt máy cắt đầu cực và máy cắt kích từ, gây <strong>Trip đồng thời cả 2 Tổ máy S1 và S2</strong> (thời gian xử lý 1,85 giờ).</li>\n        <li><strong>Lần 2 (13h46 ngày 23/10/2024):</strong> Xuất hiện sự cố chạm đất DC thứ hai tại hệ thống nhiên liệu (lỗi chạm đất duy trì không tự giải trừ). Xung nhiễu tiếp tục kích hoạt chức năng bảo vệ 86GA, 86GB làm <strong>Trip lặp lại cả 2 Tổ máy S1 và S2</strong> (thời gian xử lý 3,65 giờ, sản lượng thiếu hụt 3,942 tr. kWh).</li>\n      </ul>\n      <h3 class="sub-title">II. Giải pháp phòng ngừa triệt để</h3>\n      <div class="callout callout-danger">\n        <strong>Giải pháp kỹ thuật:</strong> Tiến hành cách ly dò tìm triệt để điểm chạm đất cáp DC ngoài hiện trường; lắp đặt bổ sung các bộ lọc nhiễu quang và rơ le phụ trung gian cách ly điện áp một chiều trước khi đưa tín hiệu bảo vệ vào cuộn trip 86GA/86GB.\n      </div>\n    </section>\n\n    '}, {'id': 'sc-buc-ong', 'title': 'ÁP LỰC LÒ HƠI\n        9. Thống kê các sự cố bục ống áp lực buồng đốt lò hơi năm 2024', 'html': '<section id="sc-buc-ong" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">ÁP LỰC LÒ HƠI</span>\n        9. Thống kê các sự cố bục ống áp lực buồng đốt lò hơi năm 2024\n      </div>\n      \n<div class="table-container"><table class="data-table">\n        <thead>\n          <tr>\n            <th>Thời gian</th>\n            <th>Vị trí / Thiết bị</th>\n            <th>Cấp sự cố</th>\n            <th>Thời gian dừng</th>\n            <th>Đặc điểm sự cố</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td>03/01/2024</td>\n            <td>Bục ống sinh hơi</td>\n            <td>Cấp 3</td>\n            <td>118,97 giờ</td>\n            <td>Mài mòn cơ học vách ống buồng đốt.</td>\n          </tr>\n          <tr>\n            <td>28/02/2024</td>\n            <td>Bục ống sinh hơi</td>\n            <td>Cấp 3</td>\n            <td>82,97 giờ</td>\n            <td>Xói mòn thành ống dưới tác động xỉ than CFB.</td>\n          </tr>\n          <tr>\n            <td>18/04/2024</td>\n            <td>Bục ống sinh hơi</td>\n            <td>Cấp 3</td>\n            <td>115,73 giờ</td>\n            <td>Bục vách buồng đốt, tăng áp lực buồng đốt.</td>\n          </tr>\n          <tr>\n            <td>21/05/2024</td>\n            <td>Bục ống sinh hơi</td>\n            <td>Cấp 3</td>\n            <td>115,32 giờ</td>\n            <td>Giảm mỏng kim loại ống SA-210C dưới mức an toàn.</td>\n          </tr>\n          <tr>\n            <td>26/05/2024</td>\n            <td>Bục ống sinh hơi</td>\n            <td>Cấp 3</td>\n            <td>84,45 giờ</td>\n            <td>Mài mòn cơ học diện rộng buồng đốt.</td>\n          </tr>\n          <tr>\n            <td>28/05/2024</td>\n            <td>Bục ống quá nhiệt cấp 3</td>\n            <td>Cấp 3</td>\n            <td>76,70 giờ</td>\n            <td>Xói mòn tro bay chùm ống quá nhiệt cấp 3.</td>\n          </tr>\n          <tr>\n            <td>07/06/2024</td>\n            <td>Bục ống sinh hơi</td>\n            <td>Cấp 3</td>\n            <td>125,98 giờ</td>\n            <td>Bục vỡ ống sinh hơi áp lực cao.</td>\n          </tr>\n          <tr>\n            <td>27/06/2024</td>\n            <td>Bục ống lò hơi</td>\n            <td>Cấp 3</td>\n            <td>54,73 giờ</td>\n            <td>Thủng vách ống buồng đốt.</td>\n          </tr>\n          <tr>\n            <td>06/09/2024</td>\n            <td>Bục ống sinh hơi</td>\n            <td>Cấp 3</td>\n            <td>71,97 giờ</td>\n            <td>Bục ống sinh hơi trước bão Yagi.</td>\n          </tr>\n          <tr>\n            <td>03/10/2024</td>\n            <td>Bục ống sinh hơi</td>\n            <td>Cấp 3</td>\n            <td>58,80 giờ</td>\n            <td>Xói mòn cơ học bề mặt ngoài ống.</td>\n          </tr>\n          <tr>\n            <td>25/10/2024</td>\n            <td>Bục ống sinh hơi</td>\n            <td>Cấp 2</td>\n            <td>168,12 giờ</td>\n            <td>Sự cố bục ống sinh hơi nghiêm trọng kéo dài 7 ngày.</td>\n          </tr>\n          <tr>\n            <td>28/10/2024</td>\n            <td>Bục ống sinh hơi</td>\n            <td>Cấp 3</td>\n            <td>116,28 giờ</td>\n            <td>Bục ống sinh hơi sau đợt xử lý ngày 25/10.</td>\n          </tr>\n          <tr>\n            <td>18/11/2024</td>\n            <td>Bục ống lò hơi</td>\n            <td>Cấp 3</td>\n            <td>59,82 giờ</td>\n            <td>Xói mòn tro xỉ làm rách vách ống.</td>\n          </tr>\n        </tbody>\n      </table></div>\n    </section>\n  '}], 2025: [{'id': 'sc-overview', 'title': 'TỔNG QUAN VẬN HÀNH\n        Đánh giá tình hình kỹ thuật và sự cố năm 2025', 'html': '<section id="sc-overview" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-aux">TỔNG QUAN VẬN HÀNH</span>\n        Đánh giá tình hình kỹ thuật và sự cố năm 2025\n      </div>\n      <p>Năm 2025 ghi nhận <strong>10 vụ sự cố chính thức</strong> được lập biên bản và lưu trữ trong hệ thống quản lý kỹ thuật của Nhà máy Nhiệt điện Mông Dương 1. Các sự cố tập trung vào van áp lực cao, board mạch điều khiển van tuabin, đặc tính nhiên liệu than ẩm và một sự cố nhị thứ điện hy hữu gây ngừng lò máy:</p>\n      \n<div class="table-container"><table class="data-table">\n        <thead>\n          <tr>\n            <th>Thời gian</th>\n            <th>Thiết bị / Vị trí</th>\n            <th>Phân loại</th>\n            <th>Thời gian dừng</th>\n            <th>Sản lượng thiếu hụt</th>\n            <th>Tóm tắt sự cố</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td><strong>12/02/2025</strong></td>\n            <td>Chân van hồi liệu (Loop Seal)</td>\n            <td>Lò hơi</td>\n            <td>122,58 giờ</td>\n            <td>33,098 tr. kWh</td>\n            <td>Xì hở xỉ nóng và tro áp lực cao tại chân hồi liệu buồng đốt.</td>\n          </tr>\n          <tr>\n            <td><strong>24/02/2025</strong></td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Áp lực Lò</td>\n            <td>41,25 giờ</td>\n            <td>11,138 tr. kWh</td>\n            <td>Bục ống sinh hơi do mài mòn cơ học hạt tro xỉ.</td>\n          </tr>\n          <tr>\n            <td><strong>28/02/2025</strong></td>\n            <td>Van an toàn hơi tái nhiệt (RH SV)</td>\n            <td>Cơ khí van</td>\n            <td>67,07 giờ</td>\n            <td>18,108 tr. kWh</td>\n            <td>Van an toàn hơi tái nhiệt bị kênh đĩa van xả liên tục ra ngoài.</td>\n          </tr>\n          <tr>\n            <td><strong>15/03/2025</strong></td>\n            <td>Đường cấp phốt phát &amp; Van MOV 1B</td>\n            <td>Lò hơi / Van</td>\n            <td>65,25 giờ</td>\n            <td>35,235 tr. kWh</td>\n            <td>Xử lý xì hở đường định lượng phốt phát bao hơi và kẹt van MOV hơi chính 1B.</td>\n          </tr>\n          <tr>\n            <td><strong>28/04/2025</strong></td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Áp lực Lò</td>\n            <td>69,10 giờ</td>\n            <td>18,657 tr. kWh</td>\n            <td>Bục ống sinh hơi vách buồng đốt dưới tác động dòng liệu.</td>\n          </tr>\n          <tr>\n            <td><strong>05/05/2025</strong></td>\n            <td>Ống xả đọng trước van Stop S1</td>\n            <td>Cơ khí Tuabin</td>\n            <td>7,93 giờ</td>\n            <td>4,284 tr. kWh</td>\n            <td>Xì hở đường ống xả đọng hơi chính áp lực cao trước van Main Stop Tuabin S1.</td>\n          </tr>\n          <tr>\n            <td><strong>18/05/2025</strong></td>\n            <td>Ống sinh hơi buồng đốt</td>\n            <td>Áp lực Lò</td>\n            <td>60,12 giờ</td>\n            <td>16,232 tr. kWh</td>\n            <td>Bục ống sinh hơi buồng đốt tầng sôi CFB.</td>\n          </tr>\n          <tr>\n            <td><strong>25/06/2025</strong></td>\n            <td>Van ETD Tuabin Tổ máy S2</td>\n            <td>C&amp;I / Tuabin</td>\n            <td>1,63 giờ</td>\n            <td>0,882 tr. kWh</td>\n            <td>Hỏng board card điều khiển van xả sự cố khẩn cấp ETD (Emergency Trip Device).</td>\n          </tr>\n          <tr>\n            <td><strong>07/10/2025</strong></td>\n            <td>Hệ thống cấp than buồng đốt</td>\n            <td>Nhiên liệu</td>\n            <td>56,05 giờ</td>\n            <td>0,000 tr. kWh</td>\n            <td>Than ẩm bết dính gây tắc nghẽn liên hoàn các máy cấp than buồng đốt.</td>\n          </tr>\n          <tr>\n            <td><strong>11/10/2025</strong></td>\n            <td>Tủ MC 16BBB07 / TU 16BBB</td>\n            <td>Phần Điện</td>\n            <td>0,03 giờ</td>\n            <td>0,018 tr. kWh</td>\n            <td>Giắc cắm mạch áp công tơ bị xoay ngang gây chạm chập 2 pha, nhảy TU, Trip 2 lò và S1.</td>\n          </tr>\n        </tbody>\n      </table></div>\n    </section>\n\n    '}, {'id': 'sc-1202', 'title': 'PHẦN LÒ HƠI\n        1. Sự cố xì hở chân van hồi liệu Loop Seal (12/02/2025)', 'html': '<section id="sc-1202" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">PHẦN LÒ HƠI</span>\n        1. Sự cố xì hở chân van hồi liệu Loop Seal (12/02/2025)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng và Thiệt hại</h3>\n      <p>Lúc 07h17 ngày 12/02/2025, phát hiện khói bụi nóng đỏ xì phì mạnh ra ngoài lớp vỏ bảo ôn tại khu vực chân van hồi liệu Loop Seal buồng đốt. Lớp bê tông chịu mài mòn bị xói thủng làm thất thoát áp lực gió hồi liệu và đe dọa nung đỏ kết cấu kim loại sàn lò. Trưởng ca quyết định dừng lò khẩn cấp để xử lý; thời gian dừng lò kéo dài <strong>122,58 giờ</strong> (~5 ngày), sản lượng điện thiếu hụt lên tới <strong>33,098 tr. kWh</strong>.</p>\n    </section>\n\n    '}, {'id': 'sc-2402', 'title': 'ÁP LỰC LÒ HƠI\n        2. Sự cố bục ống sinh hơi buồng đốt lò hơi (24/02/2025)', 'html': '<section id="sc-2402" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">ÁP LỰC LÒ HƠI</span>\n        2. Sự cố bục ống sinh hơi buồng đốt lò hơi (24/02/2025)\n      </div>\n      <h3 class="sub-title">I. Diễn biến và Khắc phục</h3>\n      <p>Lúc 02h50 ngày 24/02/2025, phát hiện chênh lệch lưu lượng nước cấp / hơi chính tăng vọt, áp lực âm buồng đốt dao động mạnh. Xác định lò bị bục ống sinh hơi, ca trực đã chủ động giảm tải, tách hơi và dừng lò an toàn để thay thế đoạn ống bục hỏng; thời gian khắc phục là <strong>41,25 giờ</strong> (thiếu hụt 11,138 tr. kWh).</p>\n    </section>\n\n    '}, {'id': 'sc-2802', 'title': 'VAN ÁP LỰC\n        3. Sự cố kênh đĩa van an toàn đường hơi tái nhiệt (28/02/2025)', 'html': '<section id="sc-2802" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-mech">VAN ÁP LỰC</span>\n        3. Sự cố kênh đĩa van an toàn đường hơi tái nhiệt (28/02/2025)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng &amp; Phân tích</h3>\n      <p>Lúc 09h56 ngày 28/02/2025, van an toàn (Safety Valve) trên đường hơi tái nhiệt sau khi tác động xả áp đã không thể tự đóng kín hoàn toàn (bị kênh đĩa van). Hơi tái nhiệt áp lực và nhiệt độ cao xả liên tục ra ngoài khí quyển gây mất áp lực hơi tái, hao hụt lượng lớn nước khử khí và đe dọa giảm sâu hiệu suất chu trình nhiệt.</p>\n      <p><strong>Xử lý:</strong> Vận hành phải xin lệnh giảm tải và tách lò để đội sửa chữa cơ khí tiếp cận, xử lý mài rà bề mặt làm kín đĩa van và căn chỉnh lực ép lò xo van an toàn; thời gian ngừng lò kéo dài <strong>67,07 giờ</strong>.</p>\n    </section>\n\n    '}, {'id': 'sc-1503', 'title': 'PHẦN LÒ HƠI\n        4. Xì hở đường cấp phốt phát bao hơi và kẹt van MOV hơi chính Lò 1B (15/03/2025)', 'html': '<section id="sc-1503" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">PHẦN LÒ HƠI</span>\n        4. Xì hở đường cấp phốt phát bao hơi và kẹt van MOV hơi chính Lò 1B (15/03/2025)\n      </div>\n      <h3 class="sub-title">I. Diễn biến liên hoàn</h3>\n      <ul>\n        <li>Lúc 12h03 ngày 15/03/2025, phát hiện xì hở dung dịch phốt phát áp lực cao tại đường ống châm hóa chất bao hơi Lò 1B, đe dọa ăn mòn kim loại và gây mất an toàn cho thiết bị xung quanh sàn bao hơi.</li>\n        <li>Trong quá trình tiến hành thao tác giảm tải để đóng cô lập đường hơi chính Lò 1B, van điện động hơi chính (MOV) Lò 1B bị lỗi kẹt cơ cấu truyền động, không thể đóng kín hoàn toàn từ phòng điều khiển trung tâm.</li>\n        <li>Ca trực buộc phải dừng khẩn cấp Lò 1B để xử lý đồng thời cả điểm xì hở phốt phát và sửa chữa van MOV hơi chính; thời gian xử lý kéo dài <strong>65,25 giờ</strong> (thiếu hụt 35,235 tr. kWh).</li>\n      </ul>\n    </section>\n\n    '}, {'id': 'sc-2804', 'title': 'ÁP LỰC LÒ HƠI\n        5. Sự cố bục ống sinh hơi vách buồng đốt lò hơi (28/04/2025)', 'html': '<section id="sc-2804" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">ÁP LỰC LÒ HƠI</span>\n        5. Sự cố bục ống sinh hơi vách buồng đốt lò hơi (28/04/2025)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng</h3>\n      <p>Lúc 12h42 ngày 28/04/2025, phát hiện bục ống sinh hơi vách buồng đốt, tiếng rít xì áp lực lớn tại khu vực giàn ống vách. Vận hành đã khẩn trương thực hiện quy trình hạ tải, tách lò và ấn MFT để bàn giao cho đội sửa chữa cắt vá ống; thời gian dừng lò là <strong>69,10 giờ</strong> (thiếu hụt 18,657 tr. kWh).</p>\n    </section>\n\n    '}, {'id': 'sc-0505', 'title': 'PHẦN TUABIN\n        6. Xì hở đường ống xả đọng trước van Main Stop đầu vào Tuabin S1 (05/05/2025)', 'html': '<section id="sc-0505" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-mech">PHẦN TUABIN</span>\n        6. Xì hở đường ống xả đọng trước van Main Stop đầu vào Tuabin S1 (05/05/2025)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng &amp; Xử lý</h3>\n      <p>Lúc 11h19 ngày 05/05/2025, phát hiện xì hở hơi siêu nhiệt áp lực cao (hơi chính ~170 bar, 538°C) tại đoạn ống xả đọng ngay trước cụm van chặn chính (Main Stop Valve - MSV) đầu vào Tuabin S1. Luồng hơi áp lực cao phun mạnh trong gian máy đe dọa nung nóng cáp điện điều khiển và an toàn nhân sự.</p>\n      <div class="callout callout-warning">\n        <strong>Xử lý:</strong> Ca trực xin lệnh khẩn cấp giảm tải tổ máy S1 để cô lập đường xả đọng và hàn vá khẩn cấp đoạn ống bị rò rỉ; khôi phục lại tổ máy sau <strong>7,93 giờ</strong>.\n      </div>\n    </section>\n\n    '}, {'id': 'sc-1805', 'title': 'ÁP LỰC LÒ HƠI\n        7. Sự cố bục ống sinh hơi buồng đốt lò hơi (18/05/2025)', 'html': '<section id="sc-1805" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">ÁP LỰC LÒ HƠI</span>\n        7. Sự cố bục ống sinh hơi buồng đốt lò hơi (18/05/2025)\n      </div>\n      <h3 class="sub-title">I. Diễn biến</h3>\n      <p>Lúc 19h55 ngày 18/05/2025, xuất hiện hiện tượng mất cân bằng lưu lượng nước cấp / lưu lượng hơi, áp lực buồng đốt tăng về phía dương, xác định bục ống sinh hơi buồng đốt. Lò hơi được dừng an toàn để thực hiện công tác kiểm tra, hàn thay thế ống trong thời gian <strong>60,12 giờ</strong> (sản lượng điện thiếu hụt 16,232 tr. kWh).</p>\n    </section>\n\n    '}, {'id': 'sc-2506', 'title': 'C&I / TUABIN\n        8. Hỏng board card van bảo vệ ngắt khẩn cấp ETD Tuabin S2 (25/06/2025)', 'html': '<section id="sc-2506" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-mech">C&amp;I / TUABIN</span>\n        8. Hỏng board card van bảo vệ ngắt khẩn cấp ETD Tuabin S2 (25/06/2025)\n      </div>\n      <h3 class="sub-title">I. Cơ chế sự cố</h3>\n      <p>Lúc 21h26 ngày 25/06/2025, mạch điều khiển van ngắt khẩn cấp ETD (Emergency Trip Device) của Tuabin S2 bị lỗi phần cứng bo mạch điện tử (Board card). Lỗi board phát tín hiệu chập chờn tác động nhầm vào van điện tử điều khiển hệ thống dầu bảo vệ tuabin, làm sụt áp suất dầu EH và gây Trip Tuabin S2 (thời gian gián đoạn xử lý thay card là <strong>1,63 giờ</strong>).</p>\n    </section>\n\n    '}, {'id': 'sc-0710', 'title': 'NHIÊN LIỆU\n        9. Than ẩm gây bết dính và tắc nghẽn hệ thống cấp than buồng đốt (07/10/2025)', 'html': '<section id="sc-0710" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-boiler">NHIÊN LIỆU</span>\n        9. Than ẩm gây bết dính và tắc nghẽn hệ thống cấp than buồng đốt (07/10/2025)\n      </div>\n      <h3 class="sub-title">I. Hiện tượng &amp; Xử lý</h3>\n      <p>Lúc 15h21 ngày 07/10/2025, do mưa lớn kéo dài làm độ ẩm toàn phần than cấp vào lò tăng vọt vượt tiêu chuẩn thiết kế. Than ẩm bết dính tạo thành các vòm than đóng tảng gây tắc liên hoàn tại các phễu than rơi và máy cấp than buồng đốt. Thiếu hụt nhiên liệu nghiêm trọng làm tụt nhiệt độ sàn liệu, buộc phải ngừng lò để thông tắc cơ học toàn bộ tuyến cấp than (thời gian xử lý kéo dài <strong>56,05 giờ</strong>).</p>\n    </section>\n\n    '}, {'id': 'sc-1110', 'title': 'PHẦN ĐIỆN\n        10. Giắc cắm mạch áp công tơ bị xoay ngang gây chạm chập, Trip 2 Lò và Tổ máy S1 (11/10/2025)', 'html': '<section id="sc-1110" class="incident-section">\n      <div class="incident-title">\n        <span class="badge badge-elec">PHẦN ĐIỆN</span>\n        10. Giắc cắm mạch áp công tơ bị xoay ngang gây chạm chập, Trip 2 Lò và Tổ máy S1 (11/10/2025)\n      </div>\n      <h3 class="sub-title">I. Diễn biến sự cố nhị thứ hy hữu</h3>\n      <p>Vào lúc 18h13 ngày 11/10/2025, xuất hiện sự cố ngắn mạch pha-pha tại tủ máy cắt 10kV <strong>16BBB07</strong> (ngăn máy cắt cấp nguồn tự dùng cho Máy nén khí B):</p>\n      <ul>\n        <li>Giắc cắm mạch áp cấp cho công tơ đo đếm tại tủ MC 16BBB07 bị lỏng ngàm cố định và xoay ngang, dẫn tới chạm chập ngắn mạch trực tiếp 2 pha nhị thứ.</li>\n        <li>Dòng ngắn mạch làm nhảy đồng thời Attomat Q4 tại tủ MC 16BBB07 và Attomat Q2 tủ biến điện áp TU thanh cái 16BBB.</li>\n        <li>Mất tín hiệu điện áp đo lường TU thanh cái 16BBB làm hệ thống bảo vệ hiểu sai trạng thái, dẫn tới:\n          <ol>\n            <li><strong>Lò 1B bị Trip</strong> do mất toàn bộ tín hiệu vận hành của các quạt khói và quạt gió.</li>\n            <li>Máy nén khí B dừng đột ngột làm tụt áp lực khí nén điều khiển toàn khối dưới 4 bar, kích hoạt bảo vệ áp lực khí nén thấp làm <strong>Trip tiếp Lò 1A và Trip toàn bộ Tổ máy S1</strong>.</li>\n          </ol>\n        </li>\n      </ul>\n      <h3 class="sub-title">II. Biện pháp phòng ngừa</h3>\n      <div class="callout callout-danger">\n        <strong>Yêu cầu siết chặt:</strong> Kiểm tra rà soát toàn bộ các đầu giắc cắm đo đếm, hàng kẹp mạch áp công tơ tại tất cả các tủ máy cắt 10kV và 0.4kV; cố định chống xoay và bọc cách điện bảo vệ ngăn ngừa chạm chập cơ học tương tự.\n      </div>\n    </section>\n  '}]};

    const yearMeta = {
      2017: { title: "Hồ sơ sự cố năm 2017", desc: "Năm ghi nhận 5 sự cố chính (Điện, UPS, mất áp lực khí nén điều khiển) và sự cố nước vào thân Tuabin 2 khi dừng kiểm tra FAC.", badge: "5 sự cố + 1 FAC" },
      2018: { title: "Hồ sơ sự cố năm 2018", desc: "Tổng cộng 11 sự cố: Rơ le áp lực dầu OLTC MBA T2, rơ le so lệch 87GT TI561, sự cố tăng nhiệt độ hơi tái nhiệt Tuabin S2, thủy kích Bypass hạ áp 1A.", badge: "11 sự cố" },
      2019: { title: "Hồ sơ sự cố năm 2019", desc: "Tổng cộng 8 sự cố: Khởi đầu chuỗi bục ống sinh hơi CFB, lỗi chuyển nguồn thanh cái 10kV FTS, mất nguồn khớp nối thủy lực, sét đánh ĐD 571/573.", badge: "8 sự cố" },
      2020: { title: "Hồ sơ sự cố năm 2020", desc: "Đỉnh điểm 18 vụ sự cố: 11 vụ bục ống áp lực lò do đốt than pha trộn nhiều xít đá, sự cố mất nước bình khử khí, trip biến tần quạt khói và lỗi bảo vệ 59GN.", badge: "18 sự cố" },
      2021: { title: "Hồ sơ sự cố năm 2021", desc: "Năm ghi nhận sự cố cấp 1 cháy cổ góp máy phát S1 (dừng 27 ngày), 15 vụ bục ống sinh hơi và chủ trương thay thế mảng ống sang vật liệu SA213-T91.", badge: "20 vụ (Cấp 1)" },
      2022: { title: "Hồ sơ sự cố năm 2022", desc: "Các sự cố đo lường C&I chân không bình ngưng nhánh A, dừng tuabin S2 do lỗi module servo PSVO van hơi chính, mất điện thanh cái 10kV trạm tuần hoàn 06BBH.", badge: "6 sự cố" },
      2023: { title: "Hồ sơ sự cố năm 2023", desc: "Bục ống sinh hơi Lò 1B kéo theo MFT 1A, lỗi nguồn bộ chuyển đổi khớp nối bơm cấp, kẹt trục Tuabin S2 và chuột chạm chập tủ MC 942B đêm giao thừa.", badge: "8 sự cố lớn" },
      2024: { title: "Hồ sơ sự cố năm 2024", desc: "Lỗi Watchdog Timer CPU Lò 1A, MFT liên hoàn 1B & 1A, siêu bão số 3 Yagi gây Blackout toàn trạm, chạm đất DC kép làm trip 2 tổ máy hai lần liên tiếp.", badge: "10 sự cố lớn" },
      2025: { title: "Hồ sơ sự cố năm 2025", desc: "Xì chân van hồi liệu Loop Seal, kênh đĩa van an toàn hơi tái nhiệt, hỏng board card van ETD tuabin S2, giắc cắm công tơ 16BBB07 xoay ngang chạm chập.", badge: "10 sự cố" }
    };

    let activeYear = 2017;

    function renderFolderTree() {
      const treeEl = document.getElementById('folderTree');
      treeEl.innerHTML = '';

      Object.keys(incidentData).sort((a,b)=>a-b).forEach(y => {
        const year = parseInt(y);
        const incidents = incidentData[year] || [];
        const meta = yearMeta[year] || { title: `Năm ${year}`, desc: '', badge: `${incidents.length} mục` };

        const folderDiv = document.createElement('div');
        folderDiv.className = `year-folder ${year === activeYear ? 'open active-folder' : ''}`;
        folderDiv.id = `folder-${year}`;

        // Folder Header
        const row = document.createElement('div');
        row.className = 'folder-row';
        row.onclick = () => selectYear(year);

        row.innerHTML = `
          <div class="folder-row-left">
            <span class="folder-toggle-icon">▶</span>
            <span class="folder-icon">📁</span>
            <span>Thư mục ${year}</span>
          </div>
          <span class="folder-badge">${meta.badge}</span>
        `;

        // Folder Children Files
        const childrenUl = document.createElement('ul');
        childrenUl.className = 'folder-children';

        incidents.forEach((item, idx) => {
          const li = document.createElement('li');
          li.className = 'file-item';
          li.id = `nav-item-${item.id}`;
          li.onclick = (e) => {
            e.stopPropagation();
            scrollToIncident(year, item.id);
          };
          
          // clean short title
          let shortTitle = item.title.replace(/^[0-9]+\.\s*/, '').replace(/<[^>]*>?/gm, '');
          if (shortTitle.length > 34) shortTitle = shortTitle.substring(0, 32) + '...';

          li.innerHTML = `
            <span class="file-icon">📄</span>
            <span title="${item.title.replace(/<[^>]*>?/gm, '')}">${shortTitle}</span>
          `;
          childrenUl.appendChild(li);
        });

        folderDiv.appendChild(row);
        folderDiv.appendChild(childrenUl);
        treeEl.appendChild(folderDiv);
      });
    }

    
    function openMobileSidebar() {
      const sidebar = document.getElementById('sidebarExplorer');
      const backdrop = document.getElementById('sidebarBackdrop');
      if (sidebar) sidebar.classList.add('mobile-open');
      if (backdrop) backdrop.classList.add('active');
    }

    function closeMobileSidebar() {
      const sidebar = document.getElementById('sidebarExplorer');
      const backdrop = document.getElementById('sidebarBackdrop');
      if (sidebar) sidebar.classList.remove('mobile-open');
      if (backdrop) backdrop.classList.remove('active');
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('sidebarExplorer');
      if (sidebar && sidebar.classList.contains('mobile-open')) {
        closeMobileSidebar();
      } else {
        openMobileSidebar();
      }
    }

    function selectYear(year) {
      activeYear = year;

      // Update folder tree UI
      document.querySelectorAll('.year-folder').forEach(el => {
        if (el.id === `folder-${year}`) {
          el.classList.add('active-folder');
          el.classList.toggle('open');
        } else {
          el.classList.remove('active-folder');
        }
      });

      renderViewer();
    }

    function renderViewer() {
      const viewerEl = document.getElementById('mainViewer');
      const incidents = incidentData[activeYear] || [];
      const meta = yearMeta[activeYear] || { title: `Năm ${activeYear}`, desc: '', badge: '' };

      let html = `
        <div class="viewer-hero">
          <div class="viewer-hero-header">
            <div>
              <h2>📂 ${meta.title}</h2>
              <p>${meta.desc}</p>
            </div>
            <span class="badge badge-aux" style="font-size:0.85rem; padding: 4px 10px;">${meta.badge}</span>
          </div>
          <div class="quick-stats">
            <div class="stat-chip">📑 Số lượng hồ sơ chi tiết: <strong>${incidents.length} văn bản</strong></div>
            <div class="stat-chip">🏭 Đơn vị: <strong>Nhiệt điện Mông Dương 1</strong></div>
            <div class="stat-chip">⏱️ Trạng thái lưu trữ: <strong>Đã thẩm tra kỹ thuật</strong></div>
          </div>
        </div>
        <div class="incidents-container">
      `;

      if (incidents.length === 0) {
        html += `
          <div class="empty-state">
            <h3>Chưa có dữ liệu hồ sơ sự cố năm ${activeYear}</h3>
          </div>
        `;
      } else {
        incidents.forEach(item => {
          html += item.html;
        });
      }

      html += `</div>`;
      viewerEl.innerHTML = html;
      viewerEl.scrollTop = 0;
    }

    function scrollToIncident(year, incidentId) {
      if (window.innerWidth <= 768) {
        closeMobileSidebar();
      }
      if (activeYear !== year) {
        activeYear = year;
        document.querySelectorAll('.year-folder').forEach(el => {
          if (el.id === `folder-${year}`) {
            el.classList.add('active-folder');
            el.classList.add('open');
          } else {
            el.classList.remove('active-folder');
          }
        });
        renderViewer();
      }

      // Highlight in sidebar
      document.querySelectorAll('.file-item').forEach(el => el.classList.remove('selected'));
      const navItem = document.getElementById(`nav-item-${incidentId}`);
      if (navItem) navItem.classList.add('selected');

      // Scroll inside viewer
      setTimeout(() => {
        const el = document.getElementById(incidentId);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          el.classList.add('highlight');
          setTimeout(() => el.classList.remove('highlight'), 2000);
        }
      }, 50);
    }

    function expandAllFolders() {
      document.querySelectorAll('.year-folder').forEach(el => el.classList.add('open'));
    }

    function collapseAllFolders() {
      document.querySelectorAll('.year-folder').forEach(el => el.classList.remove('open'));
    }

    // Search filter across all years and incidents
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderFolderTree();
        renderViewer();
        return;
      }

      expandAllFolders();

      // Filter in sidebar
      document.querySelectorAll('.file-item').forEach(el => {
        const text = el.textContent.toLowerCase();
        if (text.includes(q)) {
          el.style.display = 'flex';
        } else {
          el.style.display = 'none';
        }
      });

      // Filter in main viewer
      const cards = document.querySelectorAll('.incident-section');
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        if (text.includes(q)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    });

    // Initial render
    renderFolderTree();
    renderViewer();
  </script>

  <!-- Floating Action Button for Mobile -->
  <button class="fab-menu" id="fabMenu" onclick="openMobileSidebar()">
    <span>📂</span>
    <span>Danh mục</span>
  </button>

</body>
</html>
